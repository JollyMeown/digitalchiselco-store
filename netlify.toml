[build]
  command = "npm run build"

# Our own Netlify functions (the nightly scheduler + its background runner).
# esbuild bundles their TypeScript imports from src/lib/*. The Astro SSR
# server function is separate and unaffected.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # sharp ships native binaries esbuild cannot inline; Netlify installs the
  # linux build at deploy time. Needed by /pin/<slug>.jpg (Pinterest art).
  external_node_modules = ["sharp"]

[build.environment]
  NODE_VERSION = "22"
  # The IndexNow key (public/<key>.txt, src/lib/indexnow.ts) is public by
  # design: search engines fetch it to confirm the site is ours. Netlify's
  # smart secret detection would otherwise read the 32-hex string as a leaked
  # secret and stop the deploy.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "d8645a298486e17b25dc84f748badb5a"

# Netlify Image CDN: allow transforming our Supabase-hosted product images.
# Used by /pinterest-rss.xml to serve Pin-sized (1200x900) JPEGs from our own
# domain — Pinterest rejected the raw 794x596 originals as too small.
[images]
  remote_images = ["https://tutalnieozbngrsfywes.supabase.co/storage/v1/object/public/site-media/.*"]
  # The anon key is public by design (RLS-protected); service_role runs only in the
  # server function. Tell Netlify's secrets scanner these are intentional so the build
  # doesn't fail. (Without this, Netlify aborts the deploy when it sees the keys.)
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SUPABASE_URL,PUBLIC_SUPABASE_ANON_KEY,SUPABASE_SERVICE_ROLE_KEY,PADDLE_API_KEY,PUBLIC_PADDLE_CLIENT_TOKEN,PADDLE_WEBHOOK_SECRET,MAILERLITE_API_KEY,RESEND_API_KEY,CRON_SECRET"

# ── Security headers ─────────────────────────────────────────────────
# Applied to every response. The CSP here is deliberately narrow: it locks
# down framing (anti-clickjacking), plugins, and the <base> tag WITHOUT a
# script-src directive, so it adds defense-in-depth without breaking Astro's
# inline scripts, the Paddle checkout overlay, GA, or Google Fonts. (A full
# script-src CSP would need per-request nonces, which static headers can't do.)
# frame-ancestors: 'self' + localhost so the Laser Studio desktop app's "My Shop"
# tab (an iframe served from http://localhost:<port>) can embed the site. Web
# attackers can't serve from a visitor's localhost, so clickjacking protection is
# effectively unchanged. X-Frame-Options is dropped on purpose: it can't express
# an allow-list, and every current browser prefers frame-ancestors when present.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy = "frame-ancestors 'self' http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; upgrade-insecure-requests"

# ── Redirects ────────────────────────────────────────────────────────
# Canonical: www → apex (or vice versa — pick one)
[[redirects]]
  from = "https://www.digitalchiselco.com/*"
  to = "https://digitalchiselco.com/:splat"
  status = 301
  force = true
